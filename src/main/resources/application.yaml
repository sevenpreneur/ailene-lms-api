spring:
  application:
    name: lms
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 30000
      max-lifetime: 240000
      idle-timeout: 180000
      minimum-idle: 1
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
  jackson:
    property-naming-strategy: SNAKE_CASE

server:
  port: ${PORT:8080}

google:
  oauth:
    client-id: ${GOOGLE_OAUTH_ID}

security:
  secret-key: ${SECRET_KEY}

app:
  base-url: ${APP_BASE_URL:}

qstash:
  url: ${QSTASH_URL:}
  token: ${QSTASH_TOKEN:}

openai:
  api-key: ${OPENAI_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
