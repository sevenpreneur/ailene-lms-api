spring:
  application:
    name: lms
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
  jackson:
    property-naming-strategy: SNAKE_CASE

server:
  port: ${PORT:8080}

google:
  oauth:
    client-id: ${GOOGLE_OAUTH_ID}

management:
  endpoints:
    web:
      exposure:
        include: health,info
